name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://sonoran_hub:sonoran_hub@127.0.0.1:5432/sonoran_hub
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sonoran_hub
          POSTGRES_USER: sonoran_hub
          POSTGRES_PASSWORD: sonoran_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonoran_hub -d sonoran_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify clean checkout has no generated package output
        run: |
          if find apps packages -mindepth 2 -maxdepth 2 -type d -name dist -print -quit | grep -q .; then
            echo "Generated workspace dist output must not be required by validation"
            exit 1
          fi

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Validate formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
